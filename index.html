<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060a10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ervin Central">
  <title>Ervin Central</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <a class="mark" href="#/home" aria-label="Ervin Central home">
        <span class="mark-word"><b>Ervin</b><i>Central</i></span>
        <span class="mark-sub">Family HQ</span>
      </a>
      <nav class="nav">
        <a href="#/home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
        <a href="#/calendar" data-route="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
        <a href="#/school" data-route="school"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg><span>School</span></a>
        <a href="#/chores" data-route="chores"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg><span>Chores</span></a>
        <a href="#/coins" data-route="coins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.8-2.5 2-2.5.8-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/></svg><span>Coins</span><em id="coins-badge" hidden></em></a>
      </nav>
    </aside>

    <div class="body">
      <header class="topbar">
        <h1 id="page-title" class="page-title"></h1>
        <div class="top-right">
          <span id="sync-dot" class="sync-dot" hidden></span>
          <a href="#/admin" class="parent-btn admin-link">⚙︎ Admin</a>
          <span class="top-clock" data-clock></span>
          <button id="parent-btn" class="parent-btn" aria-label="Parent mode"><span class="lock-closed">🔒</span><span class="lock-open">🔓 Parent</span></button>
        </div>
      </header>
      <main id="main"></main>
    </div>
  </div>

  <div id="modal" class="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
