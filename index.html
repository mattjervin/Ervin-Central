<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#04140e">
  <meta name="application-name" content="Ervin Central">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ervin Central">
  <title>Ervin Central</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="favicon.ico?v=3" sizes="16x16 32x32 48x48">
  <link rel="icon" href="assets/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-16.png?v=3" type="image/png" sizes="16x16">
  <!-- iOS "Add to Home Screen" picks the best size; opaque PNGs, iOS rounds the corners itself -->
  <link rel="apple-touch-icon" href="assets/app-icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/app-icon-167.png?v=3">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/app-icon-152.png?v=3">
  <link rel="apple-touch-icon" sizes="120x120" href="assets/app-icon-120.png?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/app.css?v=9">
</head>
<body>
  <div class="bg-ambient" aria-hidden="true"></div>
  <div class="bg-hex" aria-hidden="true"></div>
  <div class="fireflies" id="fireflies" aria-hidden="true"></div>

  <header class="topnav" id="topnav">
    <div class="tn-inner">
      <a class="brand" href="#/home" aria-label="Ervin Central home">
        <img class="brand-hex" src="assets/app-icon-96.png?v=3" alt="" width="40" height="40">
        <span class="brand-text"><span class="brand-name">Ervin <em>Central</em></span><span class="brand-sub">Family HQ</span></span>
      </a>

      <nav class="tabs" id="tabs">
        <span class="tab-glider" aria-hidden="true"></span>
        <a href="#/home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
        <a href="#/calendar" data-route="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></a>
        <a href="#/school" data-route="school"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg><span>School</span></a>
        <a href="#/chores" data-route="chores"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg><span>Chores</span></a>
        <a href="#/coins" data-route="coins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.2 1.1-2 2.5-2s2.5.8 2.5 2-1.1 1.8-2.5 2-2.5.8-2.5 2 1.1 2 2.5 2 2.5-.8 2.5-2"/></svg><span>Coins</span><em id="coins-badge" hidden></em></a>
      </nav>

      <div class="tn-right">
        <span id="sync-dot" class="sync-dot" hidden></span>
        <span class="tn-wx" id="tn-wx"></span>
        <span class="tn-clock" data-clock></span>
        <a href="#/admin" class="tn-btn admin-link" aria-label="Parent admin">⚙︎</a>
        <button id="refresh-btn" class="tn-btn refresh-btn" aria-label="Get the latest version"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </div>
  </header>

  <main id="main" class="page"></main>

  <div id="modal" class="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
